<svg viewBox="0 0 800 210" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="ink" x="-10%" y="-20%" width="120%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.03" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <linearGradient id="tealLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5E9695"/>
    <stop offset="0.7" stop-color="#629A98"/>
    <stop offset="1" stop-color="#7CABA8"/>
  </linearGradient>
</defs>

<!-- hand-drawn heart -->
<g filter="url(#ink)">
  <path d="M92 150
           C70 124 58 110 60 92
           C62 76 78 72 92 86
           C106 72 122 76 124 92
           C126 110 114 124 92 150 Z"
        fill="none" stroke="#5E9695" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- flowing squiggle with a cursive loop, then a long broken wave tapering right -->
<g filter="url(#ink)" fill="none" stroke="url(#tealLine)" stroke-linecap="round" stroke-linejoin="round">
  <!-- loop + lead-in (solid) -->
  <path d="M196 168
           C236 168 248 150 252 130
           C256 108 244 96 230 102
           C214 109 214 138 236 150
           C262 164 300 162 326 154"
        stroke-width="5"/>
  <!-- long flowing tail, broken/hand-drawn, tapering -->
  <path d="M326 154
           C380 142 430 150 486 152
           C548 154 600 168 660 158
           C690 153 712 152 726 154"
        stroke-width="4.6" stroke-dasharray="150 7 96 6 130 8 200 0"/>
  <!-- tiny end flick, thinner -->
  <path d="M726 154 C734 154 742 153 748 152" stroke-width="3"/>
</g>
</svg>
